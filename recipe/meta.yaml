{% set name = "pygsl" %}
{% set version = "2.6.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pygsl/pygsl/releases/download/v{{ version }}/pygsl-{{ version }}.tar.gz
  sha256: 33bc9dc18808ca04f2f67e4f92a4185916728ed876971a3a0b36570672c22e71

build:
  script: |
    meson setup builddir --prefix=$PREFIX
    meson compile -C builddir
    meson install -C builddir
  number: 0
  skip: true  # [win or py<39]

requirements:
  build:
    - python
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - swig
    - make
    - cmake
    - pkg-config
    - meson
    - ninja
    - setuptools
    - numpy >=1.8.2
  host:
    - python
    - swig
    - pkg-config
    - gsl
    - numpy >=1.8.2
    - pip
    - setuptools
  run:
    - python
    - gsl
    - libopenblas
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - pygsl
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pygsl/pygsl
  summary: pygsl - GNU Scientific Library Interface
  license: GPL-2.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - steffengraber
